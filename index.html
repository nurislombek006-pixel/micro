<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер по Микроэкономике (GitHub Version)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .card { background: white; max-width: 850px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; }
        .setting-item { margin: 15px 0; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        input[type="number"], select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 90px; }
        .q-text { font-size: 1.25em; font-weight: bold; margin-bottom: 15px; color: #202124; }
        .options { list-style: none; padding: 0; }
        .options li { background: #fff; border: 2px solid #dadce0; padding: 12px 18px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .options li:hover { border-color: #1a73e8; background: #f8f9fa; }
        .options li.correct { background: #e6f4ea !important; border-color: #34a853 !important; color: #137333; font-weight: bold; }
        .options li.wrong { background: #fce8e6 !important; border-color: #ea4335 !important; color: #c5221f; }
        .options li.disabled { pointer-events: none; }
        .timer { font-size: 1.8em; font-weight: bold; color: #d93025; text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }
        .btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; transition: 0.3s; margin-top: 15px; font-weight: bold; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-secondary { background: #5f6368; color: white; }
        .btn-study { background: #f9ab00; color: white; }
        .item-box { border-bottom: 2px solid #f1f3f4; padding: 20px 0; }
        .loader { text-align: center; font-size: 1.2em; color: #666; }
    </style>
</head>
<body>

<div id="loading-screen" class="card">
    <div class="loader">Загрузка вопросов из JSON...</div>
</div>

<div id="start-screen" class="card hidden">
    <h1>Тренажер по Микроэкономике</h1>
    <div class="setting-item"><span>Время (сек, 0-9999):</span><input type="number" id="cfg-time" value="1200"></div>
    <div class="setting-item"><span>Вопросов в тесте:</span><input type="number" id="cfg-count" value="20"></div>
    <div class="setting-item"><span>Диапазон (с - по):</span><div><input type="number" id="cfg-start" value="1"> <input type="number" id="cfg-end" value="300"></div></div>
    <div class="setting-item"><span>Порядок:</span><select id="cfg-order"><option value="random">Случайный</option><option value="list">По порядку</option></select></div>
    
    <button class="btn btn-primary" onclick="initTest(true)">Тест с таймером</button>
    <button class="btn btn-secondary" onclick="initTest(false)">Режим обучения</button>
    <button class="btn btn-study" onclick="initStudy()">Изучить базу</button>
</div>

<div id="test-screen" class="card hidden">
    <div id="timer-display" class="timer">00:00</div>
    <div id="progress" style="text-align:center; color:#5f6368; margin-bottom:15px;"></div>
    <div class="question-box">
        <div id="q-text" class="q-text"></div>
        <ul id="q-options" class="options"></ul>
    </div>
    <button id="next-btn" class="btn btn-primary hidden" onclick="handleNext()">Далее</button>
</div>

<div id="study-screen" class="card hidden">
    <h1>База вопросов</h1>
    <div id="study-container"></div>
    <button class="btn btn-primary" onclick="location.reload()">Назад</button>
</div>

<div id="result-screen" class="card hidden">
    <h1>Результаты</h1>
    <h2 id="final-score" style="text-align: center; font-size: 2.5em;"></h2>
    <div id="review-container"></div>
    <button class="btn btn-primary" onclick="location.reload()">В начало</button>
</div>

<script>
    let database = [];
    let sessionQuestions = [];
    let userAnswers = [];
    let currentIdx = 0;
    let score = 0;
    let timeLeft = 0;
    let timerInterval;

    fetch('micro_tests.json')
        .then(response => {
            if (!response.ok) throw new Error('Файл не найден');
            return response.json();
        })
        .then(data => {
            database = data;
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('cfg-end').value = database.length;
        })
        .catch(err => {
            document.querySelector('.loader').innerHTML = 
                '<span style="color:red">Ошибка загрузки: ' + err.message + '<br>Убедитесь, что micro_tests.json лежит в той же папке на GitHub</span>';
        });

    function getRange() {
        const start = parseInt(document.getElementById('cfg-start').value) - 1;
        const end = parseInt(document.getElementById('cfg-end').value);
        return database.slice(Math.max(0, start), end);
    }

    function initTest(useTimer) {
        let pool = getRange();
        const count = parseInt(document.getElementById('cfg-count').value);
        if (document.getElementById('cfg-order').value === 'random') pool.sort(() => Math.random() - 0.5);
        sessionQuestions = pool.slice(0, count);

        if (useTimer) {
            timeLeft = parseInt(document.getElementById('cfg-time').value);
            startTimer();
        } else {
            document.getElementById('timer-display').innerText = "Режим обучения";
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');
        renderQuestion();
    }

    function initStudy() {
        let pool = getRange();
        const container = document.getElementById('study-container');
        container.innerHTML = "";
        pool.forEach((q, i) => {
            let div = document.createElement('div');
            div.className = 'item-box';
            let html = '<div><strong>' + (i + 1) + '. ' + q.question + '</strong></div>';
            q.options.forEach((opt, idx) => {
                let isCorrect = (idx === q.answer);
                html += '<div style="margin-left:15px; color:' + (isCorrect ? '#34a853;font-weight:bold' : '#666') + '">- ' + opt + (isCorrect ? ' ✓' : '') + '</div>';
            });
            div.innerHTML = html;
            container.appendChild(div);
        });
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('study-screen').classList.remove('hidden');
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) { clearInterval(timerInterval); finishTest(); return; }
            let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timer-display').innerText = (m<10?'0'+m:m)+":"+(s<10?'0'+s:s);
            timeLeft--;
        }, 1000);
    }

    function renderQuestion() {
        const q = sessionQuestions[currentIdx];
        document.getElementById('progress').innerText = "Вопрос " + (currentIdx + 1) + " из " + sessionQuestions.length;
        document.getElementById('q-text').innerText = q.question;
        document.getElementById('next-btn').classList.add('hidden');
        const list = document.getElementById('q-options');
        list.innerHTML = "";
        q.options.forEach((ans, i) => {
            const li = document.createElement('li');
            li.innerText = ans;
            li.onclick = () => checkAnswer(li, i);
            list.appendChild(li);
        });
    }

    function checkAnswer(el, index) {
        const q = sessionQuestions[currentIdx];
        const allLi = document.querySelectorAll('.options li');
        allLi.forEach(li => li.classList.add('disabled'));
        userAnswers.push(index);
        if (index === q.answer) {
            el.classList.add('correct');
            score++;
        } else {
            el.classList.add('wrong');
            allLi[q.answer].classList.add('correct');
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function handleNext() {
        currentIdx++;
        if (currentIdx < sessionQuestions.length) renderQuestion();
        else finishTest();
    }

    function finishTest() {
        clearInterval(timerInterval);
        document.getElementById('test-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score + " / " + sessionQuestions.length;
        
        const container = document.getElementById('review-container');
        container.innerHTML = "<h3>Анализ ответов:</h3>";
        sessionQuestions.forEach((q, i) => {
            const div = document.createElement('div');
            div.className = 'item-box';
            const isCorrect = userAnswers[i] === q.answer;
            div.innerHTML = '<div>' + (i+1) + '. ' + q.question + '</div>' +
                            '<div style="color:#34a853">✓ Верно: ' + q.options[q.answer] + '</div>' +
                            (!isCorrect ? '<div style="color:#ea4335">✗ Ваш ответ: ' + q.options[userAnswers[i]] + '</div>' : '');
            container.appendChild(div);
        });
    }
</script>
</body>
</html>
